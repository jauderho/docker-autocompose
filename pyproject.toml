[project]
name = "docker-autocompose"
version = "1.3.0"
description = "Generate a docker-compose yaml definition from a running container"
authors = [
    { name = "Red5d" },
]
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "docker",
    "yaml",
    "container",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "docker>=7.2.0",
    "pyaml>=25.7.0",
]

[project.urls]
homepage = "https://github.com/Red5d/docker-autocompose"
repository = "https://github.com/Red5d/docker-autocompose.git"
documentation = "https://github.com/Red5d/docker-autocompose/blob/master/README.md"

[project.scripts]
autocompose = "docker_autocompose.autocompose:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_autocompose"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "README.md",
    "LICENSE",
]

# Transitive dependencies of docker/requests that carry known CVEs below these
# versions. Constraints keep the resolver from ever picking a vulnerable one
# without adding them as direct dependencies.
[tool.uv]
constraint-dependencies = [
    "certifi>=2026.7.22",
    "idna>=3.15",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]
